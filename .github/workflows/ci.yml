name: CI Quality Checks

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "lts/*"
          cache: "npm"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Run ESLint
        run: npm run lint --if-present

      - name: Check Prettier formatting
        run: npm run format:check --if-present || npx prettier --check "**/*.{js,jsx,ts,tsx,json,css,scss,md}" --ignore-path .gitignore

      - name: Lint Markdown
        run: npm run lint:md --if-present || npx markdownlint '**/*.md' --ignore node_modules --ignore '**/CHANGELOG.md'
        continue-on-error: true

      - name: Check for code duplication (jscpd)
        run: npm run lint:cpd:ci --if-present || npx jscpd . --threshold 5 --reporters console
        continue-on-error: true

      - name: Upload duplication report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: jscpd-report
          path: reports/jscpd/
          retention-days: 30
        if: always()

  typecheck:
    name: TypeScript Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "lts/*"
          cache: "npm"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Check for TypeScript config
        id: check-ts
        run: |
          if [ -f "tsconfig.json" ]; then
            echo "has_typescript=true" >> $GITHUB_OUTPUT
          else
            echo "has_typescript=false" >> $GITHUB_OUTPUT
          fi

      - name: Run TypeScript compiler
        if: steps.check-ts.outputs.has_typescript == 'true'
        run: npx tsc --noEmit

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "lts/*"
          cache: "npm"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Check for test script
        id: check-tests
        run: |
          if npm run test --if-present 2>&1 | grep -q "Missing script"; then
            echo "has_tests=false" >> $GITHUB_OUTPUT
          else
            echo "has_tests=true" >> $GITHUB_OUTPUT
          fi

      - name: Run tests
        if: steps.check-tests.outputs.has_tests == 'true'
        run: npm test
        env:
          CI: true

  peer-compat:
    # React is a peer dependency, so the version in devDependencies is only one
    # point in the supported range. Build and test against each major we claim
    # to support, so widening the range stays honest.
    name: React ${{ matrix.react }} peer compatibility
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        react: ["18", "19"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "lts/*"
          cache: "npm"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Install React ${{ matrix.react }}
        run: npm install --no-save react@${{ matrix.react }} react-dom@${{ matrix.react }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Assert a single React copy is installed
        # The bug this job guards against (AFixt/afixt-investigator#1053) was a
        # DUPLICATE React, not a missing one — a nested copy silently breaks
        # hooks in consumers while the build and tests here still pass. If
        # react ever returns to `dependencies`, this step fails with 2.
        run: |
          npm ls react --all 2>&1 | head -30
          npm ls react --json --all 2>/dev/null | node -e '
            const data = JSON.parse(require("node:fs").readFileSync(0, "utf8"));
            const found = new Set();
            (function walk(node) {
              for (const [name, child] of Object.entries(node.dependencies || {})) {
                if (name === "react" && child.version) found.add(child.version);
                walk(child);
              }
            })(data);
            console.log("react versions in tree:", [...found].join(", ") || "(none)");
            if (found.size !== 1) {
              console.error(`::error::Expected exactly 1 React version, found ${found.size}`);
              process.exit(1);
            }
          '

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test
        env:
          CI: true

      - name: Smoke-test the built bundles
        # The source suite cannot see build-config regressions: #80 shipped
        # bundles that threw "React is not defined" on mount while `npm test`
        # was green. This mounts the real dist/ artifacts under each supported
        # React major.
        run: npm run test:dist
        env:
          CI: true

  engines-floor:
    # engines.node declares a floor of 22.22.2 — the real lockfile-derived
    # minimum, bound by @afixt/test-utils (^22.22.2 || ^24.15.0 || >=26.0.0).
    # Every other job runs on lts/* (Node 24), so nothing exercises that floor;
    # a floor never installed against is aspirational, not verified (#109). Pin
    # Node to the exact declared minimum and prove a clean `npm ci` succeeds
    # under .npmrc's engine-strict=true, with no EBADENGINE — so widening or
    # raising the floor stays honest.
    name: Install on declared Node floor (22.22.2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js 22.22.2 (engines.node floor)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.22.2"
          cache: "npm"
          registry-url: "https://registry.npmjs.org"

      - name: Clean install on the floor (engine-strict must not EBADENGINE)
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Build and test on the floor
        # Build and the test suite both run at the declared minimum, so a
        # test-time-only dependency on a newer Node would surface here too.
        run: |
          npm run build
          npm test
        env:
          CI: true

  usecases:
    # Validate every usecases/*.uc.yaml against @afixt/usecase-runner on each
    # PR. The suite was authored and maintained but never machine-checked, so
    # nothing caught use cases drifting from the runner's grammar (#107). This
    # is a PR-time gate, not a scheduled job — scheduled Actions are banned
    # repo-wide (#98).
    name: Validate use cases
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "lts/*"
          cache: "npm"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        # @afixt/usecase-runner is a private @afixt-scoped package; the org
        # NPM_TOKEN is what authenticates the install, same as every other job.
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Validate use case YAML against @afixt/usecase-runner
        run: npm run validate:usecases
