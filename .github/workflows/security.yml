name: Security Scanning

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  # Secret scanning — fails on verified secrets
  secret-scan:
    name: Secret Scan (TruffleHog)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: TruffleHog OSS
        # Pinned to an immutable commit SHA (v3.95.5) to avoid running a mutable
        # @main that could change under us.
        uses: trufflesecurity/trufflehog@d411fff7b8879a62509f3fa98c07f247ac089a51 # v3.95.5
        with:
          path: ./
          extra_args: --only-verified

  # Policy check — fails if a banned package resolves in the tree
  banned-deps:
    name: Banned Dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "lts/*"
          cache: "npm"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm ci --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Check for banned dependencies
        # The package.json `overrides` entry already neutralises axe-core, but
        # a silent stub is a confusing failure mode. This names the dependency
        # that pulled it in. See "axe-core is banned" in CLAUDE.md.
        run: npm run security:banned-deps

  # Quick scan on every push/PR
  npm-audit:
    name: NPM Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "lts/*"
          cache: "npm"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm ci --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Run npm audit
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Run npm audit (JSON output)
        run: npm audit --json > npm-audit-results.json || true

      - name: Upload audit results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: npm-audit-results
          path: npm-audit-results.json
          retention-days: 30

  # There is deliberately no CodeQL job here (#102).
  #
  # CodeQL cannot store its results unless GitHub Code Security is enabled for
  # the repository, and that is a settings-level decision that has been made
  # the other way: Code Security stays off, with SARIF kept as a build
  # artifact instead. The job that used to live here analysed the source
  # successfully on every run and then failed at the upload step with
  # "Code Security must be enabled for this repository", discarding the SARIF
  # it had just produced.
  #
  # That is the exact shape of failure this repository's CI policy exists to
  # remove: a check that cannot pass, carries no signal, and trains people to
  # skim past a red workflow. Unlike the CodeQL job, semgrep
  # (`npm run security:semgrep` — 110 rules over 97 files) runs locally and in
  # `check:all`, and fails the build on findings.
  #
  # The same constraint rules out every SARIF upload, not just CodeQL's — see
  # the OWASP job below, which keeps its report as an artifact. If Code
  # Security is ever enabled, both can come back together.

  # OWASP Dependency Check (comprehensive - weekly only)
  owasp-dependency-check:
    name: OWASP Dependency Check
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "lts/*"
          cache: "npm"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm ci --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: OWASP Dependency Check
        # Pinned to the `main` HEAD this workflow was already running, NOT to
        # the latest release. The last release (1.1.0, 2021) predates the
        # `args` input below — it takes `others` instead, so pinning there
        # would silently drop every flag we pass and quietly weaken the scan.
        # Dependabot is told to leave this ref alone for the same reason; see
        # .github/dependabot.yml.
        uses: dependency-check/Dependency-Check_Action@1e54355a8b4c8abaa8cc7d0b70aa655a3bb15a6c # main @ 2025-12-10
        with:
          project: ${{ github.repository }}
          path: "."
          format: "HTML,JSON,SARIF"
          args: >
            --enableExperimental
            --nodeAuditAnalyzer
            --nodePackageSkipDevDependencies false

      - name: Upload OWASP results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: owasp-dependency-check-report
          path: reports/
          retention-days: 90

      # The SARIF is deliberately NOT uploaded to GitHub Security (#102). That
      # endpoint needs Code Security enabled, which it is not, so the upload
      # step failed on every run while the artifact above — which contains the
      # same SARIF — succeeded. Download the artifact and open
      # reports/dependency-check-report.sarif in any SARIF viewer.

  # License compliance check
  license-check:
    name: License Compliance
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "lts/*"
          cache: "npm"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm ci --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Install license-checker
        run: npm install -g license-checker

      - name: Check licenses
        run: |
          license-checker --json --out licenses.json
          license-checker --summary

      - name: Check for problematic licenses
        run: |
          # Fail if GPL, AGPL, or unknown licenses found (customize as needed)
          license-checker --failOn 'GPL;AGPL;UNKNOWN' || echo "Review licenses above"

      - name: Upload license report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: license-report
          path: licenses.json
          retention-days: 90
