name: Security Scanning

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  # Only `contents: read` is needed. `security-events: write` was required to
  # upload CodeQL/SARIF results to GitHub Code Scanning, but those steps have
  # been removed — Code Security is off by decision here (#102). Restore the
  # scope alongside those steps if Code Security is ever enabled.
  contents: read

jobs:
  # Secret scanning — fails on any detected secret, verified or not (REV-757)
  secret-scan:
    name: Secret Scan (TruffleHog)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: TruffleHog OSS
        # Pinned to an immutable commit SHA (v3.95.5) to avoid running a mutable
        # @main that could change under us.
        uses: trufflesecurity/trufflehog@d411fff7b8879a62509f3fa98c07f247ac089a51 # v3.95.5
        with:
          path: ./
          # #152: pin the SCANNER, not just the action. The action is a
          # composite step that shells out to
          # `docker run … ghcr.io/trufflesecurity/trufflehog:${VERSION}`, and
          # its action.yml defaults `version` to "latest" — so pinning the
          # action SHA froze the wrapper script while the binary that actually
          # reads the code still came from a mutable tag on every run.
          #
          # That matters more for a secret scanner than for most tools: if the
          # scanner regresses, the check fails OPEN and a clean-looking result
          # is indistinguishable from a real one.
          #
          # Matched to the release this action SHA already points at. No
          # leading "v" — that is the ghcr image tag, and its existence was
          # confirmed against the registry rather than assumed.
          version: "3.95.5"

          # REV-757: --only-verified fails only on credentials trufflehog can
          # authenticate against the live service, so a revoked key — or one for a
          # service it has no verifier for — passed silently even when scanned.
          # Measured: a planted, non-example AWS key pair was NOT detected with it.
          extra_args: ""

  # Policy check — fails if a banned package resolves in the tree
  banned-deps:
    name: Banned Dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "lts/*"
          cache: "npm"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm ci --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Check for banned dependencies
        # The package.json `overrides` entry already neutralises axe-core, but
        # a silent stub is a confusing failure mode. This names the dependency
        # that pulled it in. See "axe-core is banned" in CLAUDE.md.
        run: npm run security:banned-deps

  # Quick scan on every push/PR
  npm-audit:
    name: NPM Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "lts/*"
          cache: "npm"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm ci --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Run npm audit
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Run npm audit (JSON output)
        run: npm audit --json > npm-audit-results.json || true

      - name: Upload audit results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: npm-audit-results
          path: npm-audit-results.json
          retention-days: 30

  # SAST gate. Semgrep is the static-analysis gate here, replacing CodeQL (see
  # the note below). Unlike CodeQL it needs no GitHub Code Security to store
  # results, and `--error` fails the build on findings rather than uploading to
  # an API that is turned off (#116).
  semgrep:
    name: Semgrep (SAST)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Semgrep
        # pipx is preinstalled on GitHub's ubuntu runners. Semgrep is a Python
        # tool that scans source directly, so this job needs no npm install.
        run: pipx install semgrep

      - name: Run Semgrep
        # Same config as local `npm run security:semgrep` and check:all
        # (p/javascript, p/react, p/owasp-top-ten; --error fails on findings).
        run: npm run security:semgrep

  # CodeQL Analysis (SAST) is intentionally NOT run here. codeql-action/analyze
  # uploads its results to GitHub Code Scanning as its final step, which fails
  # with "Code Security must be enabled for this repository" — Code Security is
  # off by decision in favour of artifact-based SARIF gating (#102). Worse than
  # a wasted run: the analysis completes and is then discarded at the upload, and
  # because this job was not dispatch-gated it reddened every pull request. A
  # check that cannot pass carries no signal and trains reviewers to skim past a
  # red workflow. The `semgrep` job above is the SAST gate instead — it runs on
  # every push and pull request and fails the build on findings. See
  # AFixt/a11y-mcp#138, which removed its CodeQL job for the same reason. Re-add
  # this job only if GitHub Code Security is enabled.

  # OWASP Dependency-Check as a GATE (AFixt/fleet-security#4, decided
  # 2026-09-29: gate everywhere, report-only is no longer an accepted end
  # state). This is the fleet reference job (fleet-security
  # templates/dependency-check.yml); see that file for the full rationale.
  #
  # It used to be a workflow_dispatch-only, report-only Dependency-Check_Action
  # step. That wrapper is gone: its pin builds an unpinned scanner image, and it
  # could never fail the build. This job runs on every push and pull request,
  # like the rest of this workflow. Still no schedule: scheduled workflows are
  # banned repo-wide (#98, CLAUDE.md).
  owasp-dependency-check:
    name: OWASP Dependency Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # The scan needs node_modules: without it the Node analyzers see only
      # what the npm audit API reports for the lockfile, and NVD and RetireJS
      # have nothing to match. --ignore-scripts: the scan reads files and needs
      # no install script, and none should run in a security job.
      #
      # "lts/*" rather than the reference's .nvmrc, the same as every other
      # job in this repo, so this job installs the tree the others test.
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "lts/*"
          cache: "npm"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm ci --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # The scanner image is pinned by DIGEST, so the scanner and its CVE data
      # can't change under the job. --noupdate scans against the CVE data baked
      # into that image; the step prints its age and warns past DC_MAX_AGE_DAYS.
      # To bump: take the current digest
      # (`docker buildx imagetools inspect owasp/dependency-check-action:latest`),
      # then verify locally that the repo still exits 0, and that it exits 15
      # with an empty suppression file (braces and extract-zip must fire).
      #
      # The gate: exit 15 on any finding with CVSS >= 7. Reviewed findings go in
      # .dependency-check-suppressions.xml, each with a reason, the reviewer
      # and an `until` date; src/tests/accepted-advisories.test.js pins them.
      # --enableExperimental is kept from the old job, and so are its HTML,
      # JSON and SARIF reports (the SARIF is not uploaded to Code Security,
      # which is off here, #102; it is in the artifact below).
      #
      # Exit codes: when an analyzer throws, the CLI exits 14 WITHOUT evaluating
      # --failOnCVSS, so 14 means the gate did not run, not "no findings". Any
      # exit other than 0 or 15 is retried once; a second one fails the job.
      # 15 is never retried.
      #
      # This is an npm project with no yarn.lock or pnpm-lock.yaml, so the Yarn
      # and pnpm audit analyzers can find nothing and are disabled.
      #
      # Local run (same image, same flags):
      #   docker run --rm -v "$PWD":/src -w /src "$DC_IMAGE" --project local \
      #     --scan /src --format HTML --out /src/reports --noupdate \
      #     --suppression /src/.dependency-check-suppressions.xml \
      #     --failOnCVSS 7 --enableRetired --enableExperimental \
      #     --disableYarnAudit --disablePnpmAudit
      # In a working checkout, also --exclude '**/coverage/**' and
      # '**/dist/**' (and any other build or test output), so the local scan
      # reads the same files as CI's fresh checkout, which never has them.
      - name: OWASP Dependency-Check
        env:
          DC_IMAGE: owasp/dependency-check-action@sha256:1782f0b306f3e73e98e7c1f00f3fd8ae4a6214deaceebffa38ecb821874bbfcd # built 2026-09-25, dependency-check 13.0.0
          DC_MAX_AGE_DAYS: "30"
          PROJECT: ${{ github.event.repository.name }}
        run: |
          docker pull --quiet "$DC_IMAGE"
          built=$(docker image inspect --format '{{.Created}}' "$DC_IMAGE")
          age_days=$(( ( $(date -u +%s) - $(date -u -d "$built" +%s) ) / 86400 ))
          echo "Scanner image built ${built} (age: ${age_days} day(s))"
          {
            echo "### OWASP Dependency-Check"
            echo "CVE data from image built ${built}: **${age_days} day(s) old**."
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$age_days" -gt "$DC_MAX_AGE_DAYS" ]; then
            echo "::warning title=Dependency-Check data is ${age_days} day(s) old::The pinned scanner image is older than ${DC_MAX_AGE_DAYS} days, so CVEs published since then are not checked. Bump DC_IMAGE (see the comment above it)."
          fi
          scan() {
            docker run --rm -v "$PWD":/src -w /src "$DC_IMAGE" \
              --project "$PROJECT" \
              --scan /src \
              --format HTML \
              --format JSON \
              --format SARIF \
              --out /src/reports \
              --noupdate \
              --suppression /src/.dependency-check-suppressions.xml \
              --failOnCVSS 7 \
              --enableRetired \
              --enableExperimental \
              --disableYarnAudit \
              --disablePnpmAudit
          }
          rc=0
          scan || rc=$?
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 15 ]; then
            echo "::warning title=Dependency-Check did not complete (exit ${rc})::The scan did not complete, so the CVSS check did not run. Retrying once."
            sleep 30
            rc=0
            scan || rc=$?
          fi
          case "$rc" in
            0) ;;
            15) echo "::error title=Dependency-Check found CVSS >= 7::See the owasp-dependency-check-report artifact." ;;
            *) echo "::error title=Dependency-Check did not complete (exit ${rc}), twice::The CVSS check did not run, so a real finding may be hidden. This is not a pass. See the [ERROR] lines above, then re-run the job." ;;
          esac
          exit "$rc"

      # always(): the report matters most when the gate has just failed. The
      # SARIF upload to GitHub Code Security stays out (#102): Code Security is
      # off here.
      - name: Upload OWASP results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: owasp-dependency-check-report
          path: reports/
          retention-days: 90

  # License compliance check — manual dispatch only. There is no schedule to
  # ride: scheduled workflows are banned repo-wide (#98, CLAUDE.md).
  # `npm run license:check` in check:all covers day-to-day.
  license-check:
    name: License Compliance
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "lts/*"
          cache: "npm"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm ci --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Install license-checker
        run: npm install -g license-checker

      - name: Check licenses
        run: |
          license-checker --json --out licenses.json
          license-checker --summary

      - name: Check for problematic licenses
        run: |
          # Fail if GPL, AGPL, or unknown licenses found (customize as needed)
          license-checker --failOn 'GPL;AGPL;UNKNOWN' || echo "Review licenses above"

      - name: Upload license report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: license-report
          path: licenses.json
          retention-days: 90

  # Keeps the SHA pins from rotting. Dependabot used to own refreshing them
  # (it rewrote both the SHA and the trailing `# vN.N.N` comment); Dependabot
  # and every other scheduled automation are banned repo-wide (#98), so this
  # check is the mechanism instead of it. A pinned SHA is immune to a
  # hijacked tag, and equally immune to the security fixes that tag would
  # have carried — somebody has to look, and this job is that somebody.
  #
  # Manual dispatch only, deliberately: a stale upstream tag has nothing to
  # do with the pull request in front of you, and blocking on it would train
  # people to merge past a red check. Dispatch this workflow periodically —
  # a red run here means an upstream action moved its tag, usually to ship a
  # fix; read the release notes and refresh the pin.
  #
  # No `npm ci`, deliberately: the script is dependency-free Node, and
  # checking a workflow file should not require the private @afixt registry
  # token. The unit-tested parsing half lives in scripts/action-pins.mjs.
  action-pins:
    name: Action Pin Freshness
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "lts/*"

      # `npm run`, not `node scripts/...`: the npm script is what CLAUDE.md
      # tells a developer to run, so invoking anything else here would give
      # the check two definitions that can drift apart. `npm run` reads
      # package.json only — still no `npm ci`, still no registry token.
      - name: Check action pins against their tags
        run: npm run security:action-pins
        env:
          # Raises the API rate limit from 60/hr to 5000/hr. Read-only.
          GITHUB_TOKEN: ${{ github.token }}
