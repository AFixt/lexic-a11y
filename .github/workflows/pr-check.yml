name: PR Check

on:
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  validate-workflows:
    name: Validate GitHub Actions Workflows
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Validate workflow syntax
        # One source of truth with `npm run lint:workflows`. The runner has no
        # actionlint, so the script takes its YAML-parse path here.
        run: bash scripts/lint-workflows.sh

  ci-check:
    name: CI Readiness Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Detect project type
        id: detect
        run: |
          if [ -f "package.json" ]; then
            echo "type=node" >> "$GITHUB_OUTPUT"
          elif [ -f "requirements.txt" ] || [ -f "pyproject.toml" ]; then
            echo "type=python" >> "$GITHUB_OUTPUT"
          else
            echo "type=other" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        if: steps.detect.outputs.type == 'node'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "lts/*"
          cache: "npm"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        if: steps.detect.outputs.type == 'node'
        run: npm ci --ignore-scripts
        continue-on-error: true
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Run lint check
        if: steps.detect.outputs.type == 'node'
        run: npm run lint --if-present
        continue-on-error: true

      - name: Run tests
        if: steps.detect.outputs.type == 'node'
        run: npm test --if-present
        continue-on-error: true
